[project]
name = "cementpro"
version = "0.1.0"
description = "Phase 1 laboratory prototype: preprocessing, cleaning and standardization pipeline for cement kiln and mill data."
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pydantic>=2.6", "pyyaml>=6.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
